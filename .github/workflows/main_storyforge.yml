name: Build and deploy Node.js app to Azure Web App - storyforge

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install root dependencies and build React
        run: |
          npm install
          npm run build

      - name: Install server dependencies and compile TypeScript
        run: |
          cd server
          npm install
          npm run build

      - name: Assemble deployment artifact
        run: |
          mkdir -p deploy
          cp -r build deploy/build
          cp -r server/dist deploy/server/dist
          cp server/package.json deploy/server/package.json
          cp server/package-lock.json deploy/server/package-lock.json

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BF03C57E12A54C619690ABC7F26EE0A3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_401F0B01663B4EE2958143F8D0C7CEDF }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E9761E0E75D7426F82F3D1D9ABE79864 }}

      - name: Set Azure App Service startup command
        uses: azure/appservice-settings@v1
        with:
          app-name: 'storyforge'
          general-settings-json: '[{"name": "STARTUP_COMMAND", "value": "node server/dist/index.js"}]'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'storyforge'
          slot-name: 'Production'
          package: .
          startup-command: 'node server/dist/index.js'
